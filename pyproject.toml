[project]
name = "enock-mugisha-rl-summative"
version = "1.0.0"
description = "AgriGuard: Precision irrigation & crop-health RL agent (DQN, REINFORCE, A2C, PPO in TorchRL)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "torchrl>=0.6.0",
    "tensordict>=0.6.0",
    "gymnasium>=0.29.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "tqdm>=4.66",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# uv installs the `dev` dependency-group automatically on `uv sync`, so the
# marker can run `uv run pytest -q` straight after cloning.
[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["environment", "training"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
